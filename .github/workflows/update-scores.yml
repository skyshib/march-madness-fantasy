name: Update Tournament Scores

on:
  # schedule:
    # Disabled — 2026 tournament is over. Re-enable for next year.
    # - cron: '*/15 16-23 * 3-4 *'
    # - cron: '*/15 0-6 * 3-4 *'
  workflow_dispatch: {}  # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update scores
        run: python scripts/update_scores.py --year 2026

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/stats.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update tournament scores $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
