<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>March Madness Fantasy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">🏀</span>
        <h1>March Madness Fantasy</h1>
      </div>
      <div class="controls">
        <button id="view-toggle" class="view-toggle" title="Toggle compact view">Compact Mode</button>
        <select id="year-select" aria-label="Select year"></select>
        <span id="update-indicator" class="update-indicator">Loading...</span>
      </div>
    </div>
  </header>

  <main>
    <div id="live-games-container"></div>
    <div id="scoreboard-container">
      <table id="scoreboard">
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-name">Name</th>
            <th class="col-total">Total Pts</th>
            <th class="col-remaining">Alive</th>
            <th class="col-seeds" colspan="16">Seeds 1–16</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
    </div>

    <div id="player-detail" class="detail-panel hidden">
      <button id="close-detail" class="close-btn" aria-label="Close">&times;</button>
      <h2 id="detail-name"></h2>
      <div id="detail-content"></div>
    </div>
  </main>

  <footer>
    <p>Data from ESPN. Auto-refreshes every 2 min.</p>
  </footer>

  <script src="js/espn.js?v=2"></script>
  <script src="js/scoreboard.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
